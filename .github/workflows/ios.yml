name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: 校验仓库依赖锁文件
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: 校验并记录 iOS 依赖
        run: |
          flutter pub get --enforce-lockfile
          cp pubspec.lock BUILD-pubspec.lock

      - name: 静态分析
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee BUILD-analysis.txt

      - name: 回归测试
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee BUILD-tests.txt

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -qr9 PiliNara_ios_${{env.version}}_unsigned.ipa Payload/Runner.app
          unzip -t PiliNara_ios_${{env.version}}_unsigned.ipa | tail -1
          test ! -f Payload/Runner.app/embedded.mobileprovision
          cp PiliNara_ios_${{env.version}}_unsigned.ipa PiliNara_ios_${{env.version}}_unsigned.tipa
          cmp PiliNara_ios_${{env.version}}_unsigned.ipa PiliNara_ios_${{env.version}}_unsigned.tipa
          unzip -t PiliNara_ios_${{env.version}}_unsigned.tipa | tail -1
          shasum -a 256 PiliNara_ios_${{env.version}}_unsigned.ipa > IPA-SHA256.txt
          shasum -a 256 PiliNara_ios_${{env.version}}_unsigned.tipa > TIPA-SHA256.txt
          printf '%s\n' '${{ github.sha }}' > SOURCE-COMMIT.txt

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliNara_ios_*.ipa
            PiliNara_ios_*.tipa
            IPA-SHA256.txt
            TIPA-SHA256.txt
            SOURCE-COMMIT.txt
            BUILD-pubspec.lock
            BUILD-analysis.txt
            BUILD-tests.txt

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          name: iOS-release
          path: |
            PiliNara_ios_*.ipa
            PiliNara_ios_*.tipa
            IPA-SHA256.txt
            TIPA-SHA256.txt
            SOURCE-COMMIT.txt
            BUILD-pubspec.lock
            BUILD-analysis.txt
            BUILD-tests.txt
