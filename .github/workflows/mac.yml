name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: 校验仓库依赖锁文件
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: 校验并记录 macOS 依赖
        run: |
          flutter pub get --enforce-lockfile
          cp pubspec.lock MACOS-BUILD-pubspec.lock

      - name: 静态分析
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee MACOS-BUILD-analysis.txt

      - name: 回归测试
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee MACOS-BUILD-tests.txt

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Validate macOS App
        run: |
          app=build/macos/Build/Products/Release/PiliNara.app
          test -x "$app/Contents/MacOS/PiliNara"
          plutil -lint "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/PiliNara" | tee MACOS-BUILD-binary.txt

      - name: Archive macOS App
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/PiliNara.app PiliNara_macos_${{ env.version }}.app.zip
          shasum -a 256 PiliNara_macos_*.app.zip > MACOS-SHA256.txt
          printf '%s\n' '${{ github.sha }}' > SOURCE-COMMIT.txt

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliNara.app || true
        continue-on-error: true

      - name: Rename DMG
        run: |
          for dmg in PiliNara*.dmg; do
            if [ -f "$dmg" ]; then
              mv "$dmg" PiliNara_macos_${{ env.version }}.dmg
              break
            fi
          done

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliNara_macos_*.dmg
            PiliNara_macos_*.app.zip
            MACOS-SHA256.txt
            SOURCE-COMMIT.txt
            MACOS-BUILD-pubspec.lock
            MACOS-BUILD-analysis.txt
            MACOS-BUILD-tests.txt
            MACOS-BUILD-binary.txt

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          name: macOS-release
          path: |
            PiliNara_macos_*.dmg
            PiliNara_macos_*.app.zip
            MACOS-SHA256.txt
            SOURCE-COMMIT.txt
            MACOS-BUILD-pubspec.lock
            MACOS-BUILD-analysis.txt
            MACOS-BUILD-tests.txt
            MACOS-BUILD-binary.txt
